---
- name: Installation d'UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: autoriser l'access ssh depuis le resaux lan 192.168.100.0/24
  community.general.ufw:
    rule: allow
    direction: in
    port: 22
    proto: tcp
    from_ip: "{{ trust_subnet_ssh }}"
    comment: Allow SSH from lab subnet

- name: allow additional ports
  community.general.ufw:
    rule: allow
    direction: in
    port: "{{ item }}"
    proto: tcp
    comment: Allow additional TCP port {{ item }}
  loop: "{{ additional_ports }}"

- name: deny le restes de traffic
  community.general.ufw:
    default: deny
    direction: incoming
    state: enabled

