---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Allow SSH from the lab subnet
  community.general.ufw:
    rule: allow
    direction: in
    port: 22
    proto: tcp
    from_ip: "{{ trust_subnet_ssh }}"
    comment: Allow SSH from lab subnet

- name: Allow additional TCP ports
  community.general.ufw:
    rule: allow
    direction: in
    port: "{{ item }}"
    proto: tcp
    comment: Allow additional TCP port {{ item }}
  loop: "{{ additional_ports }}"

- name: Enable UFW and deny incoming traffic by default
  community.general.ufw:
    default: deny
    direction: incoming
    state: enabled

