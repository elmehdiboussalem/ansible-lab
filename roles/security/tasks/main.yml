---
- name: Create security users
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: "{{ item.shell }}"
    state: present
    password_lock: true
  loop: "{{ security_users }}"

- name: Harden the SSH configuration
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload SSH

- name: Read lxd group information
  ansible.builtin.getent:
    database: group
    key: lxd
    fail_key: false

- name: Remove users from lxd group
  ansible.builtin.command:
    argv:
      - gpasswd
      - -d
      - "{{ item }}"
      - lxd
  loop: "{{ lxd_remove_users }}"
  when:
    - "'lxd' in ansible_facts.getent_group"
    - item in (ansible_facts.getent_group['lxd'][2] | default('')).split(',')
  changed_when: true
  become: true

