---
- name: Installer unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true

- name: Désactiver le redémarrage automatique
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52-lab-unattended-upgrades
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
    owner: root
    group: root
    mode: "0644"
