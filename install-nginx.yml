
---
- name: Installer et démarrer Nginx
  hosts: webservers
  become: true

  vars:
    nginx_package: nginx
    site_title: "Automated Secure Infrastructure Lab"
    common_packages:
      - curl
      - htop
      - tree

  tasks:
    - name: Installer Nginx
      ansible.builtin.apt:
        name: "{{ nginx_package }}"
        state: present
        update_cache: true

    - name: Démarrer et activer Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Afficher les variables
      ansible.builtin.debug:
        msg: "Notre titre de site est {{ site_title }}, le rôle du serveur est : {{ server_role }}, le serveur : {{ ansible_hostname }}"

    - name: Déployer la page web personnalisée
      ansible.builtin.template:
        src: index.html.j2
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: "0644"

    - name: Déployer la configuration Nginx
      ansible.builtin.template:
        src: custom.conf.j2
        dest: /etc/nginx/conf.d/custom.conf
        owner: root
        group: root
        mode: "0644"
      notify: Recharger Nginx

    - name: Vérifier la configuration Nginx
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Installer les paquets communs
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present

    - name: Créer le fichier du serveur principal
      ansible.builtin.copy:
        dest: /var/www/html/principal.txt
        content: "Je suis le serveur principal\n"
        owner: root
        group: root
        mode: "0644"
      when: server_role == "principal"

    - name: Supprimer le fichier si le serveur n'est pas principal
      ansible.builtin.file:
        path: /var/www/html/principal.txt
        state: absent
      when: server_role != "principal"

  handlers:
    - name: Recharger Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

