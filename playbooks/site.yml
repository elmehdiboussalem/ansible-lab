---
  - name: Configure common settings on all servers
    hosts: all
    become: true
    roles:
      - common

  - name: Configure Nginx on webservers
    hosts: webservers
    become: true
    roles:
      - nginx

  - name: Install and configure Docker
    hosts: dockerhosts
    become: true
    roles:
      - docker

  - name: Apply security baseline
    hosts: all
    become: true
    roles:
      - security

  - name: Configure the UFW firewall
    hosts: all
    become: true
    roles:
      - firewall

  - name: Filter Docker published port access
    hosts: dockerhosts
    become: true
    roles:
      - docker_firewall

  - name: Configure automatic updates
    hosts: all
    become: true
    roles:
      - updates

  - name: Install and configure fail2ban
    hosts: all
    become: true
    roles:
      - fail2ban

