---
  - name: Configure common settings on all servers
    hosts: all
    become: true
    roles:
      - common

  - name: Configure Nginx on webservers
    hosts: webservers
    become: true
    roles:
      - nginx

  - name: Configurer Docker
    hosts: dockerhosts
    become: true
    roles:
      - docker

  - name: Application des configuration de security
    hosts: all
    become: true
    roles:
      - security

  - name: installer et configurer le pare-feu ufw
    hosts: all
    become: true
    roles:
      - firewall

